[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-trojan"
version = "0.1.0"
description = "Modular open-source LLM red-teaming framework with RL-based attacker adaptation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "peft>=0.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
train = [
    "trl>=0.8.0",
    "datasets>=2.18.0",
    "bitsandbytes>=0.43.0",
]
openai = [
    "openai>=1.0.0",
    "tiktoken>=0.6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
auto-trojan = "auto_trojan.cli:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
